summary = "NVDA 谷歌TTS插件"
description = """通过受支持的 Chromium 浏览器运行时（如 Google Chrome、Microsoft Edge 或 Brave），在本地使用 Google WASM 文字转语音技术提供的语音，并将其用作 NVDA 语音合成器。NVDA 谷歌TTS插件是一个独立的开源无障碍项目。本项目不隶属于 Google LLC，也未获得 Google LLC 的赞助或认可。Google 是 Google LLC 的商标。"""
changelog = """版本 1.1：
- 将朗读进度与音频播放同步，使 NVDA 在全文朗读和中断长文本时更准确地跟踪朗读位置，同时让多句连续朗读和停顿缩短更加顺畅自然。
- 改进 SeaNet 和 Lemonbalm 语音的高速朗读与变调音质，新增支持 8 个 Lemonbalm 语音包（可用语音包增至 168 个），并在 NVDA 各处统一本地化语言名称与排序方式。
- 将多语言文本处理数据更新至 Unicode 18.0 和 CLDR 49，更准确地处理标点、表情符号和书写系统，并改进自动语言配置文件检测。
- 加强安全性：拒绝来自外部网页源的本地浏览器通信连接，并对语音包和插件更新下载实施更严格的 HTTPS 与安全校验。
- 提升音频播放与浏览器运行时的稳定性（包括为本地朗读绕过系统代理），更新对 NVDA 2027.1 的兼容支持，并在插件设置中新增可选的“捐赠...”按钮。
- 将随附的 WASM TTS 引擎升级至 20261110.1 版、websocket-client 升级至 1.10.0 版，并更新翻译。"""
