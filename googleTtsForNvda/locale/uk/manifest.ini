summary = "Google TTS для NVDA"
description = """Використовуйте WASM-голоси синтезу мовлення Google локально через підтримуване середовище виконання браузера на базі Chromium, як-от Google Chrome, Microsoft Edge або Brave, як синтезатор NVDA. Google TTS для NVDA — це незалежний проєкт з відкритим кодом, створений для забезпечення доступності. Він не пов'язаний із компанією Google LLC, не спонсорується нею та не підтримується нею. Google є торговою маркою Google LLC."""
changelog = """Версія 1.1:
- Синхронізовано перебіг мовлення з відтворенням аудіо для більш точного відстеження та переривання функції «Прочитати все», а також зроблено читання кількох речень та скорочення пауз більш плавним і чітким.
- Покращено якість високошвидкісного мовлення та висоти тону для голосів SeaNet і Lemonbalm, увімкнено 8 додаткових пакетів голосів Lemonbalm (загалом 168 доступних пакетів) та уніфіковано назви локалізованих мов і їх сортування в NVDA.
- Оновлено обробку багатомовного тексту до Unicode 18.0 та CLDR 49 для точнішої підтримки розділових знаків, емодзі, систем письма та автоматичних мовних профілів.
- Посилено безпеку шляхом блокування зовнішніх веб-джерел від локальної комунікації з браузером та запровадження суворіших перевірок HTTPS і завантажень для голосових пакетів та оновлень додатків.
- Покращено стабільність відтворення аудіо та роботи браузера (включно з обходом системних проксі-серверів для локального відтворення мовлення), оновлено сумісність із NVDA 2027.1 та додано кнопку «Пожертвувати...» у налаштуваннях додатка.
- Оновлено вбудований механізм WASM TTS до версії 20261110.1 та websocket-client до 1.10.0, а також оновлено переклади."""
