summary = "Google TTS Para NVDA"
description = """Permite utilizar localmente las voces de texto a voz de Google basadas en WASM mediante el entorno de ejecución de un navegador Chromium compatible, como Google Chrome, Microsoft Edge o Brave, y emplearlas como sintetizador de NVDA. Google TTS Para NVDA es un proyecto de accesibilidad independiente y de código abierto. No está afiliado a Google LLC ni cuenta con su patrocinio o respaldo. Google es una marca comercial de Google LLC."""
changelog = """Versión 1.1:
- Se sincronizó el progreso de la lectura con la reproducción de audio para un seguimiento más preciso durante Leer todo y al interrumpir textos largos, y se mejoró la fluidez de la lectura de varias frases y del acortamiento de pausas.
- Se mejoró la calidad de la lectura a alta velocidad y del tono en las voces SeaNet y Lemonbalm, se habilitaron 8 paquetes de voz Lemonbalm adicionales (168 paquetes utilizables en total) y se unificaron los nombres de idiomas localizados y su ordenación en todo NVDA.
- Se actualizó el tratamiento del texto multilingüe a Unicode 18.0 y CLDR 49 para mejorar el manejo de puntuación, emojis, sistemas de escritura y perfiles de idioma automáticos.
- Se reforzó la seguridad bloqueando orígenes web externos en la comunicación local con el navegador y aplicando comprobaciones más estrictas de HTTPS y descarga para los paquetes de voz y las actualizaciones del complemento.
- Se mejoró la estabilidad del audio y del entorno de ejecución del navegador (incluida la omisión del proxy del sistema para la lectura local), se actualizó la compatibilidad para NVDA 2027.1 y se añadió el botón opcional Donar... en las opciones del complemento.
- Se actualizaron el motor WASM TTS incluido a la versión 20261110.1, websocket-client a la versión 1.10.0 y las traducciones."""
