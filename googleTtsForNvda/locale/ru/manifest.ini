summary = "GoogleTTSForNVDA (Google TTS для NVDA)"
description = """Используйте локальные голоса синтеза речи Google на основе WASM через поддерживаемую среду выполнения браузера на Chromium, такую как Google Chrome, Microsoft Edge или Brave, в качестве синтезатора NVDA. Google TTS Для NVDA — это независимый открытый проект в области доступности. Он не связан с Google LLC, не спонсируется и не одобряется ею. Google является товарным знаком Google LLC."""
changelog = """Версия 1.1:
- Синхронизирован прогресс речи с воспроизведением звука для более точного отслеживания и прерывания «Читать всё», а также сделано более плавным и чистым чтение нескольких предложений и укорачивание пауз.
- Улучшено качество высокоскоростной речи и высоты тона голосов SeaNet и Lemonbalm, включены 8 дополнительных голосовых пакетов Lemonbalm (всего 168 пригодных к использованию пакетов), унифицированы локализованные названия языков и сортировка в NVDA.
- Обновлена обработка многоязычного текста до Unicode 18.0 и CLDR 49 для более точной поддержки знаков препинания, эмодзи, систем письма и автоматических языковых профилей.
- Усилена безопасность за счёт блокировки внешних веб-источников от локального взаимодействия с браузером и применения более строгих проверок HTTPS и загрузок для голосовых пакетов и обновлений дополнения.
- Повышена стабильность звука и среды выполнения браузера (включая обход системных прокси для локальной речи), обновлена совместимость с NVDA 2027.1 и добавлена необязательная кнопка «Пожертвовать...» в настройках дополнения.
- Встроенный движок WASM TTS обновлён до версии 20261110.1, websocket-client до 1.10.0, обновлены переводы."""
