summary = "Google TTS Cho NVDA"
description = """Sử dụng cục bộ các giọng chuyển văn bản thành giọng nói WASM của Google thông qua runtime trình duyệt nhân Chromium được hỗ trợ như Google Chrome, Microsoft Edge hoặc Brave làm bộ đọc cho NVDA. Google TTS Cho NVDA là một dự án trợ năng mã nguồn mở độc lập. Dự án không trực thuộc Google LLC và không được Google LLC tài trợ hay công nhận chính thức. Google là nhãn hiệu của Google LLC."""
changelog = """Phiên bản 1.1:
- Đồng bộ tiến độ đọc với âm thanh phát ra giúp NVDA theo dõi vị trí đọc chính xác hơn khi Đọc toàn bộ và khi ngắt đọc, đồng thời giúp việc đọc nhiều câu liên tiếp và rút ngắn khoảng lặng mượt mà, tự nhiên hơn.
- Cải thiện chất lượng đọc tốc độ cao và đổi cao độ trên các giọng SeaNet và Lemonbalm, mở thêm 8 gói giọng Lemonbalm (nâng tổng số gói sử dụng được lên 168) và thống nhất tên ngôn ngữ cùng thứ tự sắp xếp trên toàn NVDA.
- Cập nhật xử lý văn bản đa ngôn ngữ lên Unicode 18.0 và CLDR 49 giúp xử lý chính xác hơn dấu câu, biểu tượng cảm xúc, hệ chữ và hồ sơ ngôn ngữ tự động.
- Tăng cường bảo mật bằng cách chặn kết nối từ các trang web bên ngoài tới kênh giao tiếp trình duyệt nội bộ, đồng thời áp dụng kiểm tra HTTPS và giới hạn tải xuống chặt chẽ hơn cho gói giọng và bản cập nhật add-on.
- Nâng cao độ ổn định của âm thanh và runtime trình duyệt (bao gồm bỏ qua proxy hệ thống cho giao tiếp nội bộ), cập nhật tương thích với NVDA 2027.1 và bổ sung nút Ủng hộ... không bắt buộc trong cấu hình add-on.
- Nâng cấp công cụ WASM TTS đi kèm lên phiên bản 20261110.1, thư viện websocket-client lên 1.10.0 và cập nhật bản dịch."""
