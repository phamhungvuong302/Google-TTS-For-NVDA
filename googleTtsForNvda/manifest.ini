name = googleTtsForNvda
summary = "Google TTS For NVDA"
description = """Use Google's WASM text-to-speech voices locally through a supported Chromium browser runtime such as Google Chrome, Microsoft Edge, or Brave as an NVDA synthesizer. Google TTS For NVDA is an independent, open-source accessibility project. It is not affiliated with, sponsored by, or endorsed by Google LLC. Google is a trademark of Google LLC."""
author = "Nguyen Anh Duc <ducna1803@gmail.com>, Dao Duc Trung <trung@ddt.one> and Pham Hung Vuong <hungvuong106206@gmail.com>"
url = https://github.com/phamhungvuong302/Google-TTS-For-NVDA
version = 1.1
docFileName = readme.html
minimumNVDAVersion = 2024.1.0
lastTestedNVDAVersion = 2027.1.0
updateChannel = None
changelog = """Version 1.1:
- Synchronized speech progress with audio playback for more accurate Say All tracking and interruption, and made multi-sentence reading and pause shortening smoother and cleaner.
- Improved high-speed speech and pitch quality on SeaNet and Lemonbalm voices, enabled 8 additional Lemonbalm voice packages (168 usable packages in total), and unified localized language names and sorting across NVDA.
- Updated multilingual text handling to Unicode 18.0 and CLDR 49 for more accurate punctuation, emoji, writing-system, and automatic language profile support.
- Strengthened security by blocking external web origins from local browser communication and enforcing stricter HTTPS and download checks for voice packages and add-on updates.
- Improved audio and browser runtime stability (including bypassing system proxies for local speech), updated compatibility for NVDA 2027.1, and added an optional Donate... button in add-on settings.
- Upgraded the bundled WASM TTS engine to version 20261110.1 and websocket-client to 1.10.0, and updated translations."""
